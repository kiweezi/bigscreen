name: release-bootstrap-images

# Triggered by semantic-version tags such as v1.2.3. The workflow builds the
# minimal Raspberry Pi 4 bootstrap SD image (ARM64 runner) and the VirtualBox
# bootstrap appliance (x86_64 runner) in parallel, then attaches both to a
# GitHub release for the tag.
on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - id: semver
        name: Validate semantic version tag
        run: |
          v="${GITHUB_REF_NAME}"
          if ! printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag $v is not v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build-rpi4:
    needs: guard
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = aarch64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build Raspberry Pi 4 bootstrap SD image
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          nix build --no-write-lock-file \
            .#nixosConfigurations.bigscreen-rpi4-bootstrap.config.system.build.sdImage
          imgs=(result/sd-image/*.img.zst)
          test "${#imgs[@]}" -eq 1
          name="bigscreen-rpi4-bootstrap-${VERSION}.img.zst"
          cp "${imgs[0]}" "$name"
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpi4-bootstrap
          if-no-files-found: error
          path: |
            bigscreen-rpi4-bootstrap-*.img.zst
            bigscreen-rpi4-bootstrap-*.img.zst.sha256

  build-vbox:
    needs: guard
    runs-on: ubuntu-26.04
    steps:
      - name: Verify x86_64 runner
        run: test "$(uname -m)" = x86_64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build VirtualBox bootstrap appliance
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          nix build --no-write-lock-file \
            .#nixosConfigurations.bigscreen-vbox-bootstrap.config.system.build.virtualBoxOVA
          ovas=(result/*.ova)
          test "${#ovas[@]}" -eq 1
          name="bigscreen-vbox-bootstrap-${VERSION}.ova"
          cp "${ovas[0]}" "$name"
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vbox-bootstrap
          if-no-files-found: error
          path: |
            bigscreen-vbox-bootstrap-*.ova
            bigscreen-vbox-bootstrap-*.ova.sha256

  release:
    needs: [guard, build-rpi4, build-vbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" assets/* \
            --repo "${GITHUB_REPOSITORY}" --clobber

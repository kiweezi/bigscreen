name: release-rpi4-bootstrap

# Triggered by semantic-version tags such as v1.2.3. The workflow builds the
# minimal Raspberry Pi 4 bootstrap SD image on an ARM64 runner and attaches it
# to a GitHub release for the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-26.04-arm
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Verify ARM64 runner
        run: test "$(uname -m)" = aarch64
      - id: semver
        name: Validate semantic version tag
        run: |
          v="${GITHUB_REF_NAME}"
          if ! printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag $v is not v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build bootstrap SD image
        run: nix build --no-write-lock-file .#nixosConfigurations.bigscreen-rpi4-bootstrap.config.system.build.sdImage
      - name: Stage artifact
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          img="$(ls result/sd-image/*.img.zst)"
          name="bigscreen-rpi4-bootstrap-${VERSION}.img.zst"
          cp "$img" "$name"
          sha256sum "$name" > "$name.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "bigscreen-rpi4-bootstrap-${VERSION}.img.zst" \
            "bigscreen-rpi4-bootstrap-${VERSION}.img.zst.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Bootstrap-only Raspberry Pi 4 image. Runtime configuration comes from the comin/deploy branch."
